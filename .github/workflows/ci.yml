name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Ubuntu ${{ matrix.ubuntu }} / ${{ matrix.type }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
        type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libyaml-cpp-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.type }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install smoke test
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/howlinux"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/howlinux/bin/howlinux" list
          "$RUNNER_TEMP/howlinux/bin/howlinux" validate
